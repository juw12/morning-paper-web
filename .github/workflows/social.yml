name: Morrow Brief

# Posts the day's digest and a few alerts to the Morrow Brief pages when the edition changes.
# The schedule is a fallback in case the generator's pushes do not start workflows; a run with
# nothing new to post changes nothing.
# With no secrets set it sends nothing and records every target as skipped. See docs/SOCIAL.md.

on:
  push:
    branches: [main]
    paths:
      - index.html
  pull_request:
    paths:
      - "scripts/social_*"
      - "tests/social/**"
      - "bot/**"
      - "assets/fonts/**"
      - ".github/workflows/social*.yml"
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/social_requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: pip install -r scripts/social_requirements.txt
      - name: Python tests
        run: python -m unittest discover -s tests/social -v
      - name: Worker tests
        run: node --test bot/worker.test.mjs
      - name: Render what today's page would post
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: python scripts/social_post.py preview --page index.html --out preview
      - name: Keep the preview
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: morrow-brief-preview
          path: preview
          retention-days: 14

  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: morrow-social
      cancel-in-progress: false
    env:
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/social_requirements.txt
      - name: Install
        run: pip install -r scripts/social_requirements.txt

      - name: Open the data branch
        run: |
          git config user.name "morrow-brief[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          git ls-remote --exit-code --heads origin social-data > /dev/null
          found=$?
          set -e
          if [ "$found" -eq 0 ]; then
            git fetch --depth 1 origin social-data
            git worktree add --detach data FETCH_HEAD
          elif [ "$found" -eq 2 ]; then
            echo "social-data does not exist yet, starting empty"
            git worktree add --detach data HEAD
            git -C data rm -rf --quiet .
          else
            # Starting from an empty state here could post today's digest a second time.
            echo "::error::could not read the social-data branch (git exit $found); nothing posted"
            exit 1
          fi

      - name: Pick and freeze the next post
        run: python scripts/social_post.py build --page index.html --out data --run "$RUN_ID"

      - name: Save the claim before anything is sent
        run: |
          sha="$(bash scripts/social_save.sh "Morrow Brief data, run $RUN_ID (before delivery)")"
          echo "DATA_SHA=$sha" >> "$GITHUB_ENV"

      - name: Deliver
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MORROW_BUFFER_CHANNELS: ${{ vars.MORROW_BUFFER_CHANNELS }}
        run: |
          python scripts/social_post.py deliver --out data --run "$RUN_ID" \
            --image-base "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${DATA_SHA}/" \
            --image-base "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/social-data/"

      - name: Save the results
        if: always() && env.DATA_SHA != ''
        run: bash scripts/social_save.sh "Morrow Brief data, run $RUN_ID" "$DATA_SHA"
